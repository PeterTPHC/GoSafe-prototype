<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GoSafe prototype</title><style>body{font-family:Arial,sans-serif;margin:40px;color:#24352d}#status{padding:16px;border:1px solid #dfe7e2;border-radius:8px;max-width:520px}</style></head><body><div id="status">GoSafe prototype laden...</div><script>(async()=>{try{const r=await fetch('./prototype.b64',{cache:'no-store'});if(!r.ok)throw new Error('prototype.b64 niet gevonden');const b64=(await r.text()).trim();const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('status').textContent='Prototype kon niet worden geladen: '+e.message}})();</script></body></html>
